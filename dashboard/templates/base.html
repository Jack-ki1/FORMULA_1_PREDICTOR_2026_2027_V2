<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Predictor 2026</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">
                <span class="f1-logo">F1</span>
                <span class="f1-text">Predictor <span class="red">2026</span></span>
            </a>
            <div class="nav-links">
                <a href="/dashboard" class="nav-link">Dashboard</a>
                <a href="/standings" class="nav-link">Standings</a>
                <a href="/h2h" class="nav-link">H2H</a>
                <a href="/constructors" class="nav-link">Constructors</a>
                <a href="/analytics" class="nav-link">Analytics</a>
                <a href="/reports" class="nav-link">Reports</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2026 F1 Predictor. All rights reserved.</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
