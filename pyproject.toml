[project]
name = "f1-predictor-2026"
version = "1.0.0"
description = "F1 Race Prediction System for 2026 Season"
authors = [
    {name = "F1 Predictor Team"}
]
requires-python = ">=3.9"
dependencies = [
    "Flask>=3.0.0",
    "Flask-CORS>=4.0.0",
    "SQLAlchemy>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "requests>=2.31.0",
    "fastf1>=3.3.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]
advanced-ml = [
    "pymc>=5.10.0",
    "lifelines>=0.27.0",
    "gpy>=1.10.0",
]
reports = [
    "weasyprint>=60.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
